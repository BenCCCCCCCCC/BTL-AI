<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>S6 结局提案</title><desc>先呈现已刊标题与作者后果，再回看当时材料，不用真相分数结算。</desc><rect x="0" y="0" width="1440" height="900" rx="0" fill="#28342F" stroke="none"/><text x="48" y="50" font-family="SimSun,Songti SC,serif" font-size="24" font-weight="400" letter-spacing="2" fill="#F1E8D5">BETWEEN THE LINES</text><text x="990" y="49" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" letter-spacing="0" fill="#F1E8D5">晚报 / 截稿前的货场</text><rect x="46" y="78" width="1348" height="762" rx="0" fill="#F1E8D5" stroke="none"/><text x="80" y="115" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#8B302B">06 / 余波 · 一张已经离开编辑台的纸</text><text x="80" y="871" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#C9CEBE">设计提案 · 非运行截图 · 非正式剧情设定</text><text x="1290" y="871" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#C9CEBE">S6 / 06</text><rect x="145" y="145" width="1150" height="625" rx="0" fill="#FBF5E8" stroke="#C8BCA6"/><text x="184" y="191" font-family="SimSun,Songti SC,serif" font-size="24" font-weight="400" letter-spacing="3" fill="#202724">THE LAST EDITION</text><text x="1082" y="189" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#8B302B">本版已刊发</text><path d="M184 215 L1255 215" fill="none" stroke="#202724" stroke-width="3"/><text x="184" y="283" font-family="SimSun,Songti SC,serif" font-size="46" font-weight="400" letter-spacing="0" fill="#202724">目击者称安保率先开火</text><path d="M184 314 L1255 314" fill="none" stroke="#C8BCA6" stroke-width="1"/><text x="184" y="374" font-family="SimSun,Songti SC,serif" font-size="32" font-weight="400" letter-spacing="0" fill="#202724">他说过，事实仍有争议</text><text x="184" y="428" font-family="SimSun,Songti SC,serif" font-size="24" font-weight="400" letter-spacing="0" fill="#202724">你准确记录了目击者的说法，但录像提出相反证据。</text><text x="184" y="472" font-family="SimSun,Songti SC,serif" font-size="24" font-weight="400" letter-spacing="0" fill="#202724">编辑要求后续报道说明争议；来源说过，不等于事实成立。</text><rect x="184" y="536" width="658" height="133" rx="0" fill="#F1E8D5" stroke="none"/><text x="208" y="573" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#66675B">刊发时的材料</text><text x="208" y="616" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#202724">采访录音 / 现场录像</text><text x="887" y="569" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#202724">你的取舍</text><text x="887" y="604" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#202724">你核查了开火顺序，</text><text x="887" y="639" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#202724">没有继续资金线。</text><rect x="184" y="692" width="270" height="56" rx="0" fill="#FBF5E8" stroke="#C8BCA6"/><text x="206" y="728" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#202724">回看刊发归档</text><rect x="478" y="692" width="335" height="56" rx="0" fill="#8B302B" stroke="#8B302B"/><text x="500" y="728" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#FBF5E8">重新开始另一条调查线</text></svg>