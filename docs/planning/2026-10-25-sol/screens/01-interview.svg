250 545" fill="none" stroke="#5D695A" stroke-width="2"/><path d="M540 790 L250 545" fill="none" stroke="#5D695A" stroke-width="2"/><path d="M80 570 L430 570" fill="none" stroke="#414D41" stroke-width="2"/><path d="M80 600 L430 600" fill="none" stroke="#414D41" stroke-width="2"/><path d="M80 640 L430 640" fill="none" stroke="#414D41" stroke-width="2"/><path d="M80 690 L430 690" fill="none" stroke="#414D41" stroke-width="2"/><path d="M125 428 L125 295" fill="none" stroke="#A59F89" stroke-width="2"/><path d="M125 295 L256 295" fill="none" stroke="#A59F89" stroke-width="2"/><text x="104" y="178" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#F1E8D5">货场 / 夜班手记</text></g><text x="472" y="178" font-family="SimSun,Songti SC,serif" font-size="40" font-weight="400" letter-spacing="0" fill="#202724">货场边的目击者</text><text x="475" y="218" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#66675B">目击者 A / 你的采访对象</text><path d="M474 246 L1356 246" fill="none" stroke="#C8BCA6" stroke-width="1"/><text x="500" y="310" font-family="SimSun,Songti SC,serif" font-size="30" font-weight="400" letter-spacing="0" fill="#202724">“我看到安保先开火。</text><text x="500" y="360" font-family="SimSun,Songti SC,serif" font-size="30" font-weight="400" letter-spacing="0" fill="#202724">你们会把我的话登出来吗？”</text><text x="476" y="432" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" letter-spacing="0" fill="#66675B">你想问他什么？</text><rect x="474" y="460" width="880" height="142" rx="0" fill="#FBF5E8" stroke="#C8BCA6"/><text x="498" y="501" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#202724">你看到的是谁先开火？</text><text x="498" y="537" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#202724">请按你看到的经过说。</text><rect x="474" y="628" width="310" height="56" rx="0" fill="#8B302B" stroke="#8B302B"/><text x="496" y="664" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#FBF5E8">整理这句话的含义  →</text><rect x="806" y="628" width="226" height="56" rx="0" fill="#FBF5E8" stroke="#C8BCA6"/><text x="828" y="664" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#202724">查看随身笔记</text><text x="476" y="735" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#66675B">发送后先复核系统理解，再执行采访行动。</text><text x="476" y="765" font-family="Microsoft YaHei UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#66675B">自由输入与确认流程是后续提案；当前试玩使用预写选项。</text></svg>